<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      try {
        let currentObj = window;
        let desc = null;
        while (currentObj) {
          desc = Object.getOwnPropertyDescriptor(currentObj, 'fetch');
          if (desc) break;
          currentObj = Object.getPrototypeOf(currentObj);
        }
        if (desc && !desc.set) {
          Object.defineProperty(window, 'fetch', {
            get: desc.get || (() => desc.value),
            set: function() { console.warn('Ignored attempt to override window.fetch'); },
            configurable: true,
            enumerable: true
          });
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
